[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-redact"
version = "0.1.0"
description = "Remove sensitive data from text before you paste it into an LLM. Runs locally; nothing is uploaded."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Suman Mukherjee", email = "contactme@mukherjeesuman.com" }]
keywords = ["pii", "redaction", "privacy", "llm", "emirates-id", "aadhaar", "iban"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
local-redact = "local_redact.cli:main"

[project.urls]
Homepage = "https://github.com/sumankrsh/local-redact"
Demo = "https://sumankrsh.github.io/local-redact/"

[tool.hatch.build.targets.wheel]
packages = ["src/local_redact"]

# The pattern spec lives at the repo root so the web app and the Python
# package share one copy. It is copied into the wheel here.
[tool.hatch.build.targets.wheel.force-include]
"patterns" = "local_redact/patterns"

[tool.hatch.build.targets.sdist]
include = ["src", "patterns", "tests", "samples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
